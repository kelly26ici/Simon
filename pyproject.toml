[project]
name = "samantha"
version = "0.1.0"
description = "Whatsapp based Real Estate Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudflare>=5.6.0",
    "fastapi>=0.140.0",
    "google-genai>=2.14.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=2.48.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "supabase>=2.31.0",
    "tavily-python>=0.7.26",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "tree>=0.2.4",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
